openapi: 3.1.0
info:
  title: OnePledge Key Holder API (DRAFT)
  version: 1.0.0-draft.1
  summary: Contract B, key holder part. DRAFT pending approval by Shreyas and Vedant.
  description: |
    One blind OPRF evaluation service. Two independent instances run in series
    (holder 1, then holder 2). The caller blinds each input, so a holder never
    sees a value, and each holder owns only its own secret scalar.

    Group: ristretto255 as implemented by the Python `oprf` package 5.0.0.
    Element encoding on the wire: the 32 byte compressed ristretto point,
    standard base64 with padding (44 characters, RFC 4648 section 4).

    Required behaviour:
    - `elements[i]` in the response is `k * elements[i]` of the request, same
      order and same length, where `k` is the holder secret scalar for
      `key_version`.
    - A request is rejected as a whole (422 INVALID_ELEMENT) when any element
      does not decode to 32 bytes, is not a valid ristretto255 point, or is the
      identity (32 zero bytes). No partial result is ever returned.
    - Every accepted request is recorded as (member, request_id, item count,
      time). Elements are never stored or logged.
    - A per member daily element cap applies (429 RATE_LIMITED with
      `Retry-After`).
    - Evaluation is a pure function of (key_version, element). Repeating a
      request is safe and returns the same elements.
  license:
    name: Proprietary (course project, synthetic data only)
    identifier: LicenseRef-OnePledge-Course
servers:
  - url: http://localhost:8301
    description: Key holder 1 (local default)
  - url: http://localhost:8302
    description: Key holder 2 (local default)
security:
  - MemberApiKey: []
tags:
  - name: evaluation
  - name: health
paths:
  /v1/evaluate:
    post:
      tags: [evaluation]
      operationId: evaluate
      summary: Evaluate blinded elements with this holder's secret scalar
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateRequest'
            examples:
              default:
                externalValue: examples/key_holder/evaluate.request.json
      responses:
        '200':
          description: Evaluated elements, same order and length as the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluateResponse'
              examples:
                default:
                  externalValue: examples/key_holder/evaluate.response.json
        '401':
          $ref: '#/components/responses/Error'
        '409':
          description: KEY_VERSION_UNAVAILABLE. The pinned key_version is not active or retired-readable on this holder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          description: VALIDATION_ERROR (shape) or INVALID_ELEMENT (details list the failing indexes, never the values).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_element:
                  externalValue: examples/key_holder/evaluate.error.invalid_element.json
        '429':
          description: RATE_LIMITED. Daily element cap for this member is exhausted.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds until the cap window resets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/Error'
  /healthz:
    get:
      tags: [health]
      operationId: health
      summary: Liveness and identity of this holder
      security: []
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                default:
                  externalValue: examples/key_holder/healthz.response.json
components:
  securitySchemes:
    MemberApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Per member service key. Stored only as a SHA-256 hash by the holder.
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Caller correlation ID, echoed in the response header and in error bodies.
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Error. See `error.code`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Element:
      type: string
      description: Compressed ristretto255 point, standard base64 with padding.
      pattern: '^[A-Za-z0-9+/]{43}=$'
      minLength: 44
      maxLength: 44
    EvaluateRequest:
      type: object
      additionalProperties: false
      required: [request_id, elements]
      properties:
        request_id:
          type: string
          format: uuid
          description: Unique per call. Recorded in the holder's evaluation log.
        key_version:
          type: [integer, 'null']
          minimum: 1
          description: Pin a key version. Omitted or null means the active version.
        elements:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Element'
    EvaluateResponse:
      type: object
      additionalProperties: false
      required: [request_id, holder_id, key_version, elements]
      properties:
        request_id:
          type: string
          format: uuid
        holder_id:
          type: string
          enum: [kh1, kh2]
        key_version:
          type: integer
          minimum: 1
          description: The version actually used for every element of this response.
        elements:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Element'
    Health:
      type: object
      additionalProperties: false
      required: [status, service, holder_id, active_key_version]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          enum: [key_holder]
        holder_id:
          type: string
          enum: [kh1, kh2]
        active_key_version:
          type: integer
          minimum: 1
        test_double:
          type: boolean
          description: Present and true on the layer 1 contract test double.
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [field, issue]
      properties:
        field:
          type: string
          description: Field name or JSON pointer. Never a submitted value.
        issue:
          type: string
          description: Machine readable issue code, upper snake case.
          pattern: '^[A-Z][A-Z0-9_]*$'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum:
                - UNAUTHENTICATED
                - VALIDATION_ERROR
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - INVALID_ELEMENT
                - KEY_VERSION_UNAVAILABLE
                - PAYLOAD_TOO_LARGE
                - RATE_LIMITED
                - SERVICE_UNAVAILABLE
                - INTERNAL_ERROR
            message:
              type: string
              description: Fixed human readable sentence for the code. Never contains request data.
            request_id:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
