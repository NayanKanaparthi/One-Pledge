[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onepledge-contract-fakes"
version = "1.0.0"
description = "TEST DOUBLES of the layer 2 key holder and registry, plus the contract checker. Not production code."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "starlette>=0.37,<2",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pydantic-core>=2.14",
  "oprf>=5.0",
  "cryptography>=42",
  "structlog>=24.1",
  "PyYAML>=6.0",
  "jsonschema>=4.21",
  "openapi-spec-validator>=0.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-timeout>=2.3",
  "onepledge-testtools>=1.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.21",
]

[project.scripts]
onepledge-fake-keyholder = "onepledge_contract_fakes.key_holder.cli:main"
onepledge-fake-registry = "onepledge_contract_fakes.registry.cli:main"
onepledge-contracts = "onepledge_contract_fakes.contracts_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
onepledge_contract_fakes = ["py.typed"]
