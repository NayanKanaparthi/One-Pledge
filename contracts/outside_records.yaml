openapi: 3.1.0
info:
  title: OnePledge Outside Records API (DRAFT)
  version: 1.0.0-draft.1
  summary: Contract B, outside records part. DRAFT pending approval by Shreyas and Vedant.
  description: |
    Read-only stand-in for three independent sources a bank can legitimately
    query about a pledged vehicle: state title offices, payment deposits, and a
    digital contract vault. All data is synthetic.

    Privacy note: these three lookups are the only place a raw loan value (the
    VIN) leaves a bank agent. The VIN travels in the path or query because the
    team plan fixed these paths. Servers and clients MUST therefore never log
    request paths or query strings for this API (log the route template only).

    The data set is static for a run. Callers apply their own as-of date with
    the `from` and `to` filters on payments.
  license:
    name: Proprietary (course project, synthetic data only)
    identifier: LicenseRef-OnePledge-Course
servers:
  - url: http://localhost:8200
    description: Local default
security:
  - ClientApiKey: []
tags:
  - name: titles
  - name: payments
  - name: contracts
  - name: health
paths:
  /v1/titles/{vin}:
    get:
      tags: [titles]
      operationId: getTitle
      summary: Title record for one vehicle
      parameters:
        - $ref: '#/components/parameters/VinPath'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The title record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TitleRecord'
              examples:
                default:
                  externalValue: examples/outside_records/title.response.json
        '401':
          $ref: '#/components/responses/Error'
        '404':
          description: TITLE_NOT_FOUND. No title office holds a record for this vehicle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  externalValue: examples/outside_records/title.error.not_found.json
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/payments:
    get:
      tags: [payments]
      operationId: listPayments
      summary: Payments received for one vehicle loan, newest first
      parameters:
        - name: vin
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Vin'
        - name: from
          in: query
          required: false
          description: Inclusive lower bound on paid_on.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Inclusive upper bound on paid_on.
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: A page of payments (possibly empty), ordered by paid_on descending then payment_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPage'
              examples:
                default:
                  externalValue: examples/outside_records/payments.response.json
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/contracts/{vin}:
    get:
      tags: [contracts]
      operationId: getContracts
      summary: Contract vault records for one vehicle
      description: A vehicle can have more than one contract (for example after a refinance).
      parameters:
        - $ref: '#/components/parameters/VinPath'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: All contract records for the vehicle, ordered by signed_on ascending then contract_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractList'
              examples:
                default:
                  externalValue: examples/outside_records/contracts.response.json
        '401':
          $ref: '#/components/responses/Error'
        '404':
          description: CONTRACT_NOT_FOUND. The vault holds no contract for this vehicle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  externalValue: examples/outside_records/contracts.error.not_found.json
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /healthz:
    get:
      tags: [health]
      operationId: health
      summary: Liveness
      security: []
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                default:
                  externalValue: examples/outside_records/healthz.response.json
components:
  securitySchemes:
    ClientApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Per bank client key. Stored only as a SHA-256 hash.
  parameters:
    VinPath:
      name: vin
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Vin'
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    Error:
      description: Error. See `error.code`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Vin:
      type: string
      description: 17 character VIN, upper case, no I, O or Q. The service does not verify the check digit.
      pattern: '^[A-HJ-NPR-Z0-9]{17}$'
    TitleRecord:
      type: object
      additionalProperties: false
      required: [vin, state, title_status, lienholder_name, lien_recorded_on]
      properties:
        vin:
          $ref: '#/components/schemas/Vin'
        state:
          type: string
          pattern: '^[A-Z]{2}$'
          description: US state that issued the title.
        title_status:
          type: string
          enum: [CLEAN, SALVAGE, JUNK]
        lienholder_name:
          type: [string, 'null']
          maxLength: 200
          description: Lienholder exactly as the title office recorded it (not normalised). Null when no lien is recorded.
        lien_recorded_on:
          type: [string, 'null']
          format: date
    Payment:
      type: object
      additionalProperties: false
      required: [payment_id, vin, paid_on, amount_cents, deposit_bank_code]
      properties:
        payment_id:
          type: string
          format: uuid
        vin:
          $ref: '#/components/schemas/Vin'
        paid_on:
          type: string
          format: date
        amount_cents:
          type: integer
          minimum: 1
        deposit_bank_code:
          type: string
          pattern: '^[A-Z]{3,12}$'
          description: Code of the bank whose account received the money.
    PaymentPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
        offset:
          type: integer
    Contract:
      type: object
      additionalProperties: false
      required: [contract_id, vin, lender_name, amount_cents, signed_on, document_sha256]
      properties:
        contract_id:
          type: string
          format: uuid
        vin:
          $ref: '#/components/schemas/Vin'
        lender_name:
          type: string
          maxLength: 200
        amount_cents:
          type: integer
          minimum: 1
        signed_on:
          type: string
          format: date
        document_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    ContractList:
      type: object
      additionalProperties: false
      required: [vin, contracts]
      properties:
        vin:
          $ref: '#/components/schemas/Vin'
        contracts:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Contract'
    Health:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          enum: [outside_records]
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [field, issue]
      properties:
        field:
          type: string
        issue:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum:
                - UNAUTHENTICATED
                - VALIDATION_ERROR
                - TITLE_NOT_FOUND
                - CONTRACT_NOT_FOUND
                - RATE_LIMITED
                - SERVICE_UNAVAILABLE
                - INTERNAL_ERROR
            message:
              type: string
              description: Fixed sentence for the code. Never contains the VIN or any request data.
            request_id:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
