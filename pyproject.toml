# Repository wide tool configuration for layer 1 (SPEC 2.2).
# This file configures ruff, mypy, pytest and coverage. It is not a package:
# every component has its own pyproject.toml.

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "C901", "SIM", "RET", "PTH", "RUF", "ANN", "T20", "PL"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR2004"]

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = [
  "bank_testkit",
  "onepledge_testtools",
  "onepledge_contract_fakes",
  "onepledge_datagen",
  "onepledge_outside_records",
  "onepledge_bank_agent",
  "onepledge_evaluation",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["oprf", "oprf.*", "oblivious", "oblivious.*", "pre_commit", "pre_commit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = ["tools/tests", "contracts/fakes/tests", "datagen/tests", "outside_records/tests", "bank_agent/tests"]
# The bank agent tests share helpers through the `bank_testkit` package next to them. The root
# conftest.py loads the installed `onepledge-testtools` package (tools/, SPEC_DECISIONS 117).
pythonpath = ["bank_agent/tests"]
# Every test stops after 120 seconds; e2e tests get 600 (onepledge_testtools.pytest_plugin).
timeout = 120
markers = [
  "unit: no network, no database, no child process and no write to the file system; reading committed files is allowed",
  "integration: tests that use a real PostgreSQL server, the network, the file system or child processes",
  "contract: tests that check behaviour against the files in contracts/",
  "e2e: end to end tests that start the real services as processes",
  "reliability: tests of behaviour under failure, interruption, load or time limits",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
skip_empty = true
