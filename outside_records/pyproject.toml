[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onepledge-outside-records"
version = "1.0.0"
description = "Read-only stand-in for title offices, payment deposits and a contract vault (OnePledge layer 1)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "starlette>=0.37",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-timeout>=2.3",
  "onepledge-testtools>=1.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "jsonschema>=4.21",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.21",
]

[project.scripts]
onepledge-outside = "onepledge_outside_records.interface.cli:main"

[tool.setuptools]
package-dir = { "" = "src", "onepledge_outside_records_migrations" = "migrations" }
packages = [
  "onepledge_outside_records",
  "onepledge_outside_records.domain",
  "onepledge_outside_records.application",
  "onepledge_outside_records.infrastructure",
  "onepledge_outside_records.infrastructure.db",
  "onepledge_outside_records.interface",
  "onepledge_outside_records.interface.http",
  "onepledge_outside_records_migrations",
  "onepledge_outside_records_migrations.versions",
]

[tool.setuptools.package-data]
onepledge_outside_records = ["py.typed"]
onepledge_outside_records_migrations = ["script.py.mako"]
