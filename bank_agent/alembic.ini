# Alembic configuration of a bank database.
# `onepledge-bank db migrate` is the normal way to migrate; it reads
# MIGRATION_DATABASE_URL and DB_APP_ROLE from the environment. This file lets
# a developer run `alembic -c bank_agent/alembic.ini upgrade head` with the
# same two variables set. No URL or password is stored here.

[alembic]
script_location = %(here)s/migrations
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
