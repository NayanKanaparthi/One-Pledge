[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onepledge-bank-agent"
version = "1.0.0"
description = "The OnePledge bank agent: intake, cleaning, local checks and the bank's own evidence database (layer 1)."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "sqlalchemy>=2.1",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "structlog>=24.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "fastapi>=0.110",
  "PyYAML>=6.0",
  "jsonschema>=4.21",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.21",
]

[project.scripts]
onepledge-bank = "onepledge_bank_agent.interface.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src", "onepledge_bank_agent_migrations" = "migrations" }
packages = [
  "onepledge_bank_agent",
  "onepledge_bank_agent.domain",
  "onepledge_bank_agent.domain.cleaning",
  "onepledge_bank_agent.application",
  "onepledge_bank_agent.infrastructure",
  "onepledge_bank_agent.infrastructure.db",
  "onepledge_bank_agent.infrastructure.db.models",
  "onepledge_bank_agent.infrastructure.db.repositories",
  "onepledge_bank_agent.infrastructure.http",
  "onepledge_bank_agent.interface",
  "onepledge_bank_agent.interface.cli",
  "onepledge_bank_agent_migrations",
  "onepledge_bank_agent_migrations.versions",
]

[tool.setuptools.package-data]
onepledge_bank_agent = ["py.typed"]
onepledge_bank_agent_migrations = ["script.py.mako"]
