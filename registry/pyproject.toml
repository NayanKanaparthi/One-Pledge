[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onepledge-registry"
version = "0.1.0"
description = "OnePledge registry: one lock per asset token and an insert-only, hash-chained ledger (layer 2)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
# SPEC section 3 plus SPEC_DECISIONS 14 (the outside_records dev set, only what these tests use).
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-timeout>=2.3",
  "onepledge-testtools>=1.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "jsonschema>=4.21",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.21",
]

[project.scripts]
onepledge-registry = "onepledge_registry.interface.cli:main"

[tool.setuptools]
package-dir = { "" = "src", "onepledge_registry_migrations" = "migrations" }
packages = [
  "onepledge_registry",
  "onepledge_registry.domain",
  "onepledge_registry.application",
  "onepledge_registry.infrastructure",
  "onepledge_registry.interface",
  "onepledge_registry_migrations",
  "onepledge_registry_migrations.versions",
]

[tool.setuptools.package-data]
onepledge_registry = ["py.typed"]
onepledge_registry_migrations = ["script.py.mako"]
