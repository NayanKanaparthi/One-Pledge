[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onepledge-key-holder"
version = "0.1.0"
description = "OnePledge key holder: one of the two OPRF holders that evaluate blinded elements (layer 2)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "oprf>=5.0",
  "structlog>=24.1",
]

[project.optional-dependencies]
# SPEC section 3 plus SPEC_DECISIONS 14 (the outside_records dev set, only what these tests use).
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-timeout>=2.3",
  "onepledge-testtools>=1.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "jsonschema>=4.21",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.21",
]

[project.scripts]
onepledge-keyholder = "onepledge_key_holder.interface.cli:main"

[tool.setuptools]
package-dir = { "" = "src", "onepledge_key_holder_migrations" = "migrations" }
packages = [
  "onepledge_key_holder",
  "onepledge_key_holder.domain",
  "onepledge_key_holder.application",
  "onepledge_key_holder.infrastructure",
  "onepledge_key_holder.infrastructure.db",
  "onepledge_key_holder.interface",
  "onepledge_key_holder_migrations",
  "onepledge_key_holder_migrations.versions",
]

[tool.setuptools.package-data]
onepledge_key_holder = ["py.typed"]
onepledge_key_holder_migrations = ["script.py.mako"]
