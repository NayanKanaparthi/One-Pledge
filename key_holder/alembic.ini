# Alembic configuration of the key holder database.
# The URL is read from MIGRATION_DATABASE_URL, the owner role, so this file lets a
# developer run `alembic -c key_holder/alembic.ini upgrade head` with that variable set.
# No URL or password is stored here.

[alembic]
script_location = %(here)s/migrations
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
